services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db


  backend:
    build: .
    restart: unless-stopped
    # Port 3001 not exposed externally — Nginx proxies to it internally
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/journey_recorder
    depends_on:
      - mongo

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mongo_data:
